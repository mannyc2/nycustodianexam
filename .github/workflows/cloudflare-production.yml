name: Cloudflare production deployment

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy tested main to nycustodianexam.com
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://nycustodianexam.com
    env:
      NYCUSTODIAN_CANONICAL_ORIGIN: https://nycustodianexam.com
      NYCUSTODIAN_REQUIRE_PUBLISHED_RELEASE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: site-build
      - run: tar -xf site-build.tar
      - name: Require the current main commit
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Verify the exact artifact for publication
        run: bun run verify:artifacts
      - name: Deploy verified Static Assets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          bun run --cwd apps/site wrangler deploy --config wrangler.jsonc --strict --message "Production ${GITHUB_SHA}"
      - name: Check the public home page and sitemap
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 https://nycustodianexam.com/ -o /tmp/production-home.html
          grep -q 'https://nycustodianexam.com/' /tmp/production-home.html
          curl --fail --silent --show-error https://nycustodianexam.com/sitemap.xml -o /tmp/production-sitemap.xml
          grep -q 'https://nycustodianexam.com/' /tmp/production-sitemap.xml
