name: Certification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Frozen Bun 1.4 verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install the committed dependency graph
        run: bun install --frozen-lockfile
      - name: Verify the toolchain and repository
        run: bun run verify

  browser:
    name: Browser, accessibility, offline, and print gates
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install the committed dependency graph
        run: bun install --frozen-lockfile
      - name: Compile the validated content release
        run: bun run content:build
      - name: Install browser engines and system dependencies
        run: bun run --cwd apps/site playwright install --with-deps chromium firefox webkit
      - name: Typecheck the browser harness
        run: bun run typecheck:browser
      - name: Run the browser certification suite
        run: bun run test:browser
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-certification-evidence
          path: |
            /tmp/nycustodian-playwright-results
            /tmp/nycustodian-playwright-report
          if-no-files-found: ignore
          retention-days: 14

  cloudflare-preview:
    name: Cloudflare Static Assets preview
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install the committed dependency graph
        run: bun install --frozen-lockfile
      - name: Compile the validated content release
        run: bun run content:build
      - name: Install Chromium and system dependencies
        run: bun run --cwd apps/site playwright install --with-deps chromium
      - name: Exercise the built site through local workerd
        env:
          NYCUSTODIAN_PLAYWRIGHT_PREVIEW: cloudflare
        run: bun run test:browser:chromium --grep @cloudflare
      - name: Preserve preview failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-preview-evidence
          path: |
            /tmp/nycustodian-playwright-results
            /tmp/nycustodian-playwright-report
          if-no-files-found: ignore
          retention-days: 14
