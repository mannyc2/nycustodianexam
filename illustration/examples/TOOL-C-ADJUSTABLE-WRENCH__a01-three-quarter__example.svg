<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-hidden="true" focusable="false">
  <style>
  .outer { fill: #ffffff; stroke: #111111; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  .outer-none { fill: none; stroke: #111111; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  .struct { fill: none; stroke: #111111; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .struct-fill { fill: #ffffff; stroke: #111111; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .fine { fill: none; stroke: #111111; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .light { fill: #dddddd; stroke: #111111; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .mid { fill: #bcbcbc; stroke: #111111; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .ink { fill: #111111; stroke: none; }
</style>
  
<g transform="rotate(-24 512 512)">
  <!-- tapered handle -->
  <path class="outer" d="M130 522 Q110 550 132 582 L638 582 Q677 579 712 548 L744 518 L707 486 Q674 522 635 522 Z"/>
  <path class="struct" d="M178 550 L624 550"/>
  <ellipse class="struct" cx="172" cy="552" rx="21" ry="14"/>

  <!-- fixed upper jaw and head -->
  <path class="outer" d="M635 522 L698 455 L721 387 L774 374 L773 442 L855 442 L855 487 L756 487 L729 517 L704 548 Z"/>
  <!-- movable lower jaw, smooth face -->
  <path class="outer" d="M704 548 L733 507 L756 487 L855 487 L855 533 L780 533 L750 570 L704 582 Z"/>
  <!-- worm screw and slide -->
  <rect class="struct-fill" x="708" y="466" width="58" height="78" rx="8"/>
  <ellipse class="light" cx="737" cy="505" rx="34" ry="23"/>
  <path class="fine" d="M716 495 L724 516 M729 488 L737 522 M742 487 L750 521 M755 491 L762 513"/>
  <path class="struct" d="M773 442 L773 487 M756 487 L756 533"/>
  <!-- smooth gripping faces -->
  <path class="struct" d="M777 442 L850 442 M779 487 L850 487"/>
</g>

</svg>
