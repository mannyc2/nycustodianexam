<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>R2.8 commit-before-reveal probe</title></head>
<body>
  <main>
    <h1>Question fixture</h1>
    <form id="question-form">
      <fieldset>
        <legend>Which option?</legend>
        <label><input type="radio" name="answer" value="a"> Option A</label>
        <label><input type="radio" name="answer" value="b"> Option B</label>
      </fieldset>
      <button type="submit">Commit answer</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="outcome" hidden tabindex="-1"></section>
  </main>
  <script type="module" src="./commit-before-reveal.js"></script>
</body>
</html>
